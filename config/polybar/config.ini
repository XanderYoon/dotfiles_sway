; =========================================================
; BAR
; =========================================================
include-file = ~/.config/polybar/theme.ini

[bar/main]
enable-ipc = true
monitor = ${env:MONITOR}
width = 100%
height = 28

background = ${colors.background}
foreground = ${colors.foreground}

;font-0 = DejaVu Sans:size=11
font-0 = ${env:FONT_UI}:size=${env:FONT_UI_SIZE}
font-1 = Symbols Nerd Font:size=11
;font-2 = DejaVu Mono:size=11
font-2 = ${env:FONT_MONO}:size=${env:FONT_MONO_SIZE}

module-margin-left = 0
module-margin-right = 0

modules-left   = i3
modules-center = date
modules-right  = cpu spacer memory spacer gpu separator spacer theme-toggle spacer caffeine spacer wlan power

; =========================================================
; WORKSPACES (LEFT)
; =========================================================
[module/i3]
type = internal/i3

; ───── Ordering & stability ─────
pin-workspaces = true
index-sort = true
fuzzy-match = false

; Show all workspaces (even empty)
show-urgent = true

; Hide numeric prefix visually (keeps numeric sorting internally)
strip-wsnumbers = true

; Disable scroll-based workspace switching
enable-scroll = false
wrapping-scroll = false
enable-click = true

; ───── Focused ─────
label-focused = %name%
label-focused-background = ${colors.focused-background}
label-focused-foreground = ${colors.focused-foreground}
label-focused-padding = 2

; ───── Unfocused ─────
label-unfocused = %name%
label-unfocused-padding = 2

; ───── Visible on other monitor ─────
label-visible = %name%
label-visible-padding = 2

; ───── Urgent ─────
label-urgent = %name%
label-urgent-background = ${colors.urgent-background}
label-urgent-foreground = ${colors.urgent-foreground}
label-urgent-padding = 2

; =========================================================
; DATE & TIME (CENTER)
; =========================================================
[module/date]
type = internal/date
interval = 10

date = %a, %b %d
time = %H:%M

label = %date% · %{T2}%time%%{T-}

; =========================================================
; CPU
; =========================================================
[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage:3%%

; =========================================================
; MEMORY
; =========================================================
[module/memory]
type = internal/memory
interval = 5
label =  %percentage_used:3%%

; =========================================================
; GPU (UTILIZATION %)
; =========================================================
[module/gpu]
type = custom/script
interval = 10
exec = ~/.local/bin/gpu-usage.sh


; =========================================================
; SPACER (CONSISTENT GAP)
; =========================================================
[module/spacer]
type = custom/text
content = "  "

; =========================================================
; SEPARATOR BAR
; =========================================================
[module/separator]
type = custom/text
content = " | "
foreground = ${colors.separator}

; =========================================================
; THEME TOGGLE
; =========================================================
[module/theme-toggle]
type = custom/ipc
hook-0 = ~/.config/polybar/theme-status.sh
initial = 1
click-left = ~/.config/theme/toggle-theme.sh && polybar-msg action theme-toggle hook 0

; =========================================================
; CAFFEINE (PREVENT IDLE SLEEP)
; =========================================================
[module/caffeine]
type = custom/ipc
hook-0 = ~/.local/bin/caffeine.sh status
initial = 1
click-left = ~/.local/bin/caffeine.sh toggle && polybar-msg action caffeine hook 0

; =========================================================
; WIFI
; =========================================================
[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
label-connected = %{A1:/home/alexander-yoon/.local/bin/wifimenu.sh:}%{A}

format-disconnected = <label-disconnected>
label-disconnected = %{A1:/home/alexander-yoon/.local/bin/wifimenu.sh:}%{A}

click-right = sh -c "alacritty -e nmtui"

; =========================================================
; POWER MENU
; =========================================================
[module/power]
type = custom/text
format = 
format-padding = 2
click-left = ~/.local/bin/powermenu.sh
