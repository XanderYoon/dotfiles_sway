font_family JetBrainsMono Nerd Font
font_size 13
background_opacity 0.9
hide_window_decorations titlebar-only

include colors.conf
term xterm-256color

# Match tmux's macOS shell selection so native Kitty opens fish directly.
shell /bin/zsh -lc 'if [[ -x /opt/homebrew/bin/fish ]]; then exec /opt/homebrew/bin/fish; elif [[ -x /usr/local/bin/fish ]]; then exec /usr/local/bin/fish; else exec /bin/zsh; fi'

# On macOS, send Ctrl+S to tmux when Command+S is pressed.
map cmd+s send_text all \\x13

# macOS: send tmux pane-navigation control keys on Command+H/J/K/L.
map cmd+h send_text all \\x08
map cmd+j send_text all \\x0a
map cmd+k send_text all \\x0b
map cmd+l send_text all \\x0c
