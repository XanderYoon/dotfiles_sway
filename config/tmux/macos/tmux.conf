# macOS-specific tmux keybindings.
# Add macOS-only bindings below.
# Tmux receives Ctrl+S when Kitty sends Cmd+S on macOS.
unbind-key C-b
set-option -g prefix C-s
bind-key C-s send-prefix
set-option -g base-index 1
set-option -g pane-base-index 1

# Mouse support and vi-style pane navigation.
set-option -g mouse on
unbind-key Left
unbind-key Down
unbind-key Up
unbind-key Right
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Prefix-free Vim/Tmux pane navigation.
# Send the key to Neovim when it is active; otherwise select the adjacent Tmux pane.
bind-key -n C-h if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE '(^|/)(g?vim|nvim|vimx|view|vimdiff)'" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE '(^|/)(g?vim|nvim|vimx|view|vimdiff)'" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE '(^|/)(g?vim|nvim|vimx|view|vimdiff)'" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "ps -o comm= -t '#{pane_tty}' | grep -iqE '(^|/)(g?vim|nvim|vimx|view|vimdiff)'" "send-keys C-l" "select-pane -R"

# Catppuccin Mocha.
set-option -g status-style "bg=default,fg=#cdd6f4"
set-option -g status-left-style "bg=#181825,fg=#cba6f7,bold"
set-option -g status-right-style "bg=#181825,fg=#cdd6f4"
set-option -g window-status-style "bg=#181825,fg=#a6adc8"
set-option -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e,bold"
set-option -g pane-border-style "fg=#313244"
set-option -g pane-active-border-style "fg=#cba6f7"
set-option -g message-style "bg=#313244,fg=#cdd6f4"
set-option -g message-command-style "bg=#313244,fg=#cdd6f4"
set-option -g mode-style "bg=#f9e2af,fg=#1e1e2e"
set-option -g clock-mode-colour "#cba6f7"

# Session persistence via TPM, Resurrect, and Continuum.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'tmux-plugins/tmux-continuum'
set-option -g @catppuccin_flavor 'mocha'
set-option -g @catppuccin_status_background 'none'
set-option -g @catppuccin_status_module_text_bg '#{E:@thm_bg}'
set-option -g @catppuccin_window_left_separator ''
set-option -g @catppuccin_window_right_separator ''
set-option -g @catppuccin_window_middle_separator ''
set-option -g @catppuccin_window_number_position 'right'
set-option -g @catppuccin_window_default_fill 'number'
set-option -g @catppuccin_window_text '#W'
set-option -g @catppuccin_window_current_fill 'number'
set-option -g @catppuccin_window_current_text '#W'
set-option -g @catppuccin_status_modules_right 'directory session'
set-option -g @catppuccin_status_left_separator ''
set-option -g @catppuccin_status_right_separator ''
set-option -g @catppuccin_status_right_separator_inverse 'no'
set-option -g @catppuccin_status_fill 'icon'
set-option -g @catppuccin_status_connect_separator 'no'
set-option -g @catppuccin_directory_text '#{pane_current_path}'
set-option -g @catppuccin_status_directory_icon_bg '#{E:@thm_bg}'
set-option -g @catppuccin_status_directory_icon_fg '#{E:@thm_rosewater}'
set-option -g @catppuccin_status_session_icon_bg '#{E:@thm_bg}'
set-option -g @catppuccin_status_session_icon_fg '#{E:@thm_green}'
run '~/.tmux/plugins/tmux/catppuccin.tmux'
set-option -g @continuum-restore 'on'
set-option -g @continuum-save-interval '15'
set-option -g @resurrect-capture-pane-contents 'on'
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins'
run '~/.tmux/plugins/tpm/tpm'

# Reload tmux configuration.
bind-key r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Catppuccin Config 3 status line (without user or host).
set-option -g status-left ""
set-option -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"
set-option -g status-position top
set-option -g status 2
set-option -g status-format[1] ''

# Catppuccin Config 3 uses one status row for the styled window list.
set-option -g status 1
set-option -gu status-format[1]
set-option -gu status-format[1]
set-option -g status 1
set-option -g status on
